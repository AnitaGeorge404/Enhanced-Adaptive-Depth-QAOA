[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ddqaoa"
version = "0.1.0"
description = "Dynamic Depth QAOA for the Constrained Shortest Path Problem (course project)"
requires-python = ">=3.10"
dependencies = ["pennylane>=0.38", "numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
